name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Format and logic tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +stable fmt --check
      - name: Run logic tests
        run: cargo +stable test --locked

  windows:
    name: Build Windows x64 executable
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
      - name: Build executable with static CRT
        run: cargo +stable build --locked --release --bins --target x86_64-pc-windows-msvc
      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: iris-windows-x64
          path: target/x86_64-pc-windows-msvc/release/iris.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostic executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: iris-diagnostic-windows-x64
          path: target/x86_64-pc-windows-msvc/release/iris-diagnostic.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload IME trial executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: iris-ime-trial-windows-x64
          path: target/x86_64-pc-windows-msvc/release/iris-ime-trial.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload input comparison executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: iris-input-trial-windows-x64
          path: target/x86_64-pc-windows-msvc/release/iris-input-trial.exe
          if-no-files-found: error
          retention-days: 14
