name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Format and logic tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.99.0 fmt --check
      - name: Run logic tests
        run: cargo +1.99.0 test --locked

  windows:
    name: Build Windows x64 executable
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target x86_64-pc-windows-msvc
          rustup default 1.99.0
      - name: Build executable with static CRT
        run: cargo build --locked --release --bin iris --target x86_64-pc-windows-msvc
      - name: Package executable and notices
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload executable and notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: iris-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
