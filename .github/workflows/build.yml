name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Format and logic tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.99.0 fmt --check
      - name: Run logic tests
        run: cargo +1.99.0 test --locked --features focus-probe
      - name: Verify source icon resources
        run: python scripts/verify-icons.py

  windows:
    name: Build Windows x64 executable
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target x86_64-pc-windows-msvc
          rustup default 1.99.0
      - name: Build executable with static CRT
        run: cargo build --locked --release --bin iris --target x86_64-pc-windows-msvc
      - name: Verify embedded icon resources
        run: python scripts/verify-icons.py target/x86_64-pc-windows-msvc/release/iris.exe
      - name: Package executable and notices
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload executable and notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: iris-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Build focus-only prototype
        run: cargo build --locked --release --features focus-probe --bin iris-focus-probe --target x86_64-pc-windows-msvc
      - name: Package focus-only prototype
        shell: pwsh
        run: ./scripts/package-focus.ps1
      - name: Upload focus-only prototype
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: iris-focus-probe-windows-x64
          path: dist-focus/*
          if-no-files-found: error
          retention-days: 14
      - name: Build read-only discovery prototype
        run: cargo build --locked --release --features focus-probe --bin iris-discovery-probe --target x86_64-pc-windows-msvc
      - name: Package read-only discovery prototype
        shell: pwsh
        run: ./scripts/package-discovery.ps1
      - name: Upload read-only discovery prototype
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: iris-discovery-probe-windows-x64
          path: dist-discovery/*
          if-no-files-found: error
          retention-days: 14
      - name: Build read-only ancestor path prototype
        run: cargo build --locked --release --features focus-probe --bin iris-path-probe --target x86_64-pc-windows-msvc
      - name: Package read-only ancestor path prototype
        shell: pwsh
        run: ./scripts/package-path.ps1
      - name: Upload read-only ancestor path prototype
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: iris-path-probe-windows-x64
          path: dist-path/*
          if-no-files-found: error
          retention-days: 14
      - name: Build registration-free focus prototype
        run: cargo build --locked --release --features focus-probe --bin iris-auto-focus-probe --target x86_64-pc-windows-msvc
      - name: Package registration-free focus prototype
        shell: pwsh
        run: ./scripts/package-auto-focus.ps1
      - name: Upload registration-free focus prototype
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: iris-auto-focus-probe-windows-x64
          path: dist-auto-focus/*
          if-no-files-found: error
          retention-days: 14
      - name: Build one-press auto-send prototype
        run: cargo build --locked --release --features focus-probe --bin iris-auto-send-probe --target x86_64-pc-windows-msvc
      - name: Package one-press auto-send prototype
        shell: pwsh
        run: ./scripts/package-auto-send.ps1
      - name: Upload one-press auto-send prototype
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: iris-auto-send-probe-windows-x64
          path: dist-auto-send/*
          if-no-files-found: error
          retention-days: 14
