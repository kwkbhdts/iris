[package]
name = "iris"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
publish = false
default-run = "iris"

[features]
focus-probe = ["dep:windows"]

[[bin]]
name = "iris-focus-probe"
path = "src/bin/focus_probe.rs"
required-features = ["focus-probe"]

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", optional = true, features = ["Win32_System_Com", "Win32_UI_Accessibility"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
